spring.application.name=gespatiens

spring.datasource.url=jdbc:postgresql://localhost:5432/gespatiens-refactor
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# El esquema lo crean las migraciones de Flyway (src/main/resources/db/migration).
# Hibernate solo comprueba que las entidades coinciden con las tablas: si no, la app no arranca
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Tokens JWT del login. El secreto firma los tokens: al menos 32 caracteres y nunca en el repositorio
gespatiens.jwt.secret=${JWT_SECRET:}
# Lo que dura una sesión: una jornada de trabajo
gespatiens.jwt.expiration=PT8H

# Administrador que se crea al arrancar si no existe (ver AdminBootstrap)
gespatiens.bootstrap-admin.email=${ADMIN_EMAIL:}
gespatiens.bootstrap-admin.phone-number=${ADMIN_PHONE:}
gespatiens.bootstrap-admin.password=${ADMIN_PASSWORD:}

# Correo para que los empleados nuevos creen su contraseña. Sin MAIL_HOST no se envía nada:
# el enlace se escribe en el log de la aplicación
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
gespatiens.mail.from=${MAIL_FROM:gespatiens@localhost}
# Dónde está el frontend: los enlaces de los correos apuntan a su pantalla /crear-contrasena
gespatiens.frontend-url=${FRONTEND_URL:http://localhost:5173}
# Lo que dura el enlace del correo
gespatiens.password-setup.validity=P3D
