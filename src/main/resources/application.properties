spring.application.name=gespatiens

# DB_URL: la de Docker (docker-compose.yml). Sin ella, la de desarrollo en este equipo
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gespatiens-refactor}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# El esquema lo crean las migraciones de Flyway (src/main/resources/db/migration).
# Hibernate solo comprueba que las entidades coinciden con las tablas: si no, la app no arranca
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Tokens JWT del login. El secreto firma los tokens: al menos 32 caracteres y nunca en el repositorio
gespatiens.jwt.secret=${JWT_SECRET:}
# Lo que dura una sesión: una jornada de trabajo
gespatiens.jwt.expiration=PT8H

# Administrador que se crea al arrancar si no existe (ver AdminBootstrap)
gespatiens.bootstrap-admin.email=${ADMIN_EMAIL:}
gespatiens.bootstrap-admin.phone-number=${ADMIN_PHONE:}
gespatiens.bootstrap-admin.password=${ADMIN_PASSWORD:}

# Correo para que los empleados nuevos creen su contraseña. Sin MAIL_HOST no se envía nada:
# el enlace se escribe en el log de la aplicación
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
gespatiens.mail.from=${MAIL_FROM:gespatiens@localhost}
# Dónde está el frontend: los enlaces de los correos apuntan a su pantalla /crear-contrasena
gespatiens.frontend-url=${FRONTEND_URL:http://localhost:5173}
# Lo que dura el enlace del correo
gespatiens.password-setup.validity=P3D

# Panel de control: se avisa con 30 días de antelación de lo que vence (el informe de media estancia, en la
# fecha prevista de cada informe, y el fin de las medidas judiciales)
gespatiens.dashboard.deadline-notice=P30D

# Login: tras 5 intentos fallidos seguidos con el mismo email (nunca menos, decisión del centro), se bloquea
# durante 15 minutos
gespatiens.login.max-attempts=5
gespatiens.login.lockout=PT15M

# Perfil demo: true vuelve a cargar los datos de demostración desde cero cada día (la demo publicada en internet)
gespatiens.demo.daily-reset=${DEMO_DAILY_RESET:false}
# true: el tutorial de bienvenida sale cada vez que se entra, aunque ya se haya visto. Por defecto, en la demo
# publicada: todos los visitantes comparten las mismas cuentas y, si se recordara, solo lo vería el primero del día
gespatiens.tutorial.every-login=${TUTORIAL_EVERY_LOGIN:${DEMO_DAILY_RESET:false}}

# Documentación de la API: /v3/api-docs (OpenAPI) y /swagger-ui.html para probarla. API_DOCS=false la quita.
# Solo describe la API: para llamarla hace falta igualmente el token del login
springdoc.api-docs.enabled=${API_DOCS:true}
springdoc.swagger-ui.enabled=${API_DOCS:true}
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
