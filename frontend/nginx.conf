# La app en un solo origen: las pantallas y, en /api, la API de Spring Boot. Así no hace falta CORS
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Las firmas en PNG pesan hasta 1 MB
        client_max_body_size 2m;
    }

    # Los ficheros con huella en el nombre no cambian nunca
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Las rutas de la app (/diario, /informes/...) las resuelve React
    location / {
        try_files $uri /index.html;
    }
}
