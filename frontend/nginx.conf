# La app en un solo origen: las pantallas y, en /api, la API de Spring Boot. Así no hace falta CORS
server {
    listen 80;
    root /usr/share/nginx/html;

    # Las mismas cabeceras de seguridad que en Vercel (vercel.json). La política de contenido solo deja cargar
    # lo de la propia app: nada de scripts, estilos ni conexiones de otros sitios
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Las firmas en PNG pesan hasta 1 MB
        client_max_body_size 2m;
    }

    # Los ficheros con huella en el nombre no cambian nunca
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Un add_header dentro de un location anula los del server: se repiten las que importan aquí
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Las rutas de la app (/diario, /informes/...) las resuelve React
    location / {
        try_files $uri /index.html;
    }
}
